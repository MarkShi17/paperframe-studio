name: Render smoke test
on: [push, pull_request]
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core fontconfig
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py studio.py media.py && node --check public/studio.js
      - run: python checks/render.py
