name: Render smoke test
on: [push, pull_request]
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core fontconfig
      - run: node --check public/studio.js
      - name: Exercise the Replit entry point
        shell: bash
        run: |
          bash start-replit.sh > /tmp/paperframe-start.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..120}; do
            if curl -fsS http://127.0.0.1:3000/api/voice > /dev/null 2>&1; then break; fi
            if ! kill -0 "$server" 2>/dev/null; then cat /tmp/paperframe-start.log; exit 1; fi
            sleep 1
          done
          .replit-venv/bin/python checks/flows.py
          .replit-venv/bin/python checks/render.py
          .replit-venv/bin/python checks/http_flow.py
